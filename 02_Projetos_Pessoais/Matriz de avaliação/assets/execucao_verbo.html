<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Avaliação - Nine Box</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nav-header">
    <a href="index.html">Controle de Avaliação</a>
    <a href="Relatório de Produção.html">Relatório</a>
    <a href="matriz.html">Matriz Bloom</a>
    <a href="painel Diganostico Bloom.html">Diagnóstico Bloom</a>
    <a href="execucao_verbo.html">Execução do Verbo</a>
    <a href="escadinha taxonomia Bloom.html">Escadinha</a>
  </div>

  <h1>Painel de Avaliação Final</h1>

  <input type="text" id="filtroAluno" placeholder="Buscar aluno..." style="margin: 20px 0; padding: 10px; width: 300px; border-radius: 8px; border: none; font-size: 16px;">

  <label for="aluno">Selecione o aluno:</label>
  <select id="aluno" class="input-padrao"></select>

  <div class="secao">
    <h3>Avaliações Técnicas</h3>
    <label>AV1 (Aulas / Atividades): <input type="number" id="av1" min="0" max="10" step="0.1" readonly></label>
    <label>AV2 (Miniprojetos): <input type="number" id="av2" min="0" max="10" step="0.1" readonly></label>
    <label>AV3 (Projeto Final): <input type="number" id="av3" min="0" max="10" step="0.1" readonly></label>
  </div>

  <div class="secao">
    <h3>Notas Comportamentais</h3>
    <label>Participação (Peso 1): <input type="number" id="participacao" min="0" max="10" step="0.1"></label>
    <label>Constância (Peso 1.5): <input type="number" id="constancia" min="0" max="10" step="0.1"></label>
    <label>Trabalho em Equipe (Peso 1.5): <input type="number" id="equipe" min="0" max="10" step="0.1"></label>
  </div>

  <button onclick="calcularNotas()">Calcular Nota Final</button>

  <div id="resultado" class="secao">
    <h3>Resultado</h3>
    <p><strong>Técnico:</strong> <span id="notaTecnico"></span></p>
    <p><strong>Engajamento:</strong> <span id="notaEngajamento"></span></p>
    <p><strong>Média Final:</strong> <span id="mediaFinal"></span></p>
    <p><strong>Classificação (Nine Box):</strong> <span id="classificacao"></span></p>
  </div>

  <script src="alunos.js"></script>
  <script src="ninebox.js"></script>
  <script>
    const alunos = window.alunos || [];
    const select = document.getElementById('aluno');
    const filtro = document.getElementById('filtroAluno');

    if (!localStorage.getItem('configuracoesAvaliacao')) {
      localStorage.setItem('configuracoesAvaliacao', JSON.stringify({ av1: 8, av2: 3, av3: 1 }));
    }

    function calcularNotaFinalPorTipo(index, tipo, totalItens) {
      let soma = 0;
      let count = 0;
      for (let i = 1; i <= totalItens; i++) {
        const checked = localStorage.getItem(`aluno${index}_${tipo}${i}_check`) === 'true';
        const valor = parseFloat(localStorage.getItem(`aluno${index}_${tipo}${i}_valor`)) || 0;
        if (checked) {
          soma += valor;
          count++;
        }
      }
      return count > 0 ? Math.min(10, (soma / count) * 10) : 0;
    }

    function preencherNotasAlunoSelecionado() {
      const nome = select.value;
      const index = alunos.indexOf(nome);
      if (index < 0) {
        document.getElementById('av1').value = '';
        document.getElementById('av2').value = '';
        document.getElementById('av3').value = '';
        document.getElementById('participacao').value = '';
        document.getElementById('constancia').value = '';
        document.getElementById('equipe').value = '';
        return;
      }

      const config = JSON.parse(localStorage.getItem('configuracoesAvaliacao')) || { av1: 8, av2: 3, av3: 1 };

      const av1 = calcularNotaFinalPorTipo(index, 'aula', config.av1);
      document.getElementById('av1').value = av1 > 0 ? av1.toFixed(1) : '';

      const av2 = calcularNotaFinalPorTipo(index, 'mini', config.av2);
      document.getElementById('av2').value = av2 > 0 ? av2.toFixed(1) : '';

      const av3 = parseFloat(localStorage.getItem(`aluno${index}_final_nota`));
      document.getElementById('av3').value = !isNaN(av3) && av3 > 0 ? av3.toFixed(1) : '';

      document.getElementById('participacao').value = '';
      document.getElementById('constancia').value = '';
      document.getElementById('equipe').value = '';
    }

    function calcularNotas() {
      const av1 = parseFloat(document.getElementById('av1').value) || 0;
      const av2 = parseFloat(document.getElementById('av2').value) || 0;
      const av3 = parseFloat(document.getElementById('av3').value) || 0;

      const participacao = parseFloat(document.getElementById('participacao').value) || 0;
      const constancia = parseFloat(document.getElementById('constancia').value) || 0;
      const equipe = parseFloat(document.getElementById('equipe').value) || 0;

      const mediaTecnico = ((av1 + av2 + av3) / 3).toFixed(2);
      const mediaEngajamento = ((participacao * 1 + constancia * 1.5 + equipe * 1.5) / 4).toFixed(2);
      const mediaFinal = ((parseFloat(mediaTecnico) + parseFloat(mediaEngajamento)) / 2).toFixed(2);

      document.getElementById('notaTecnico').textContent = mediaTecnico;
      document.getElementById('notaEngajamento').textContent = mediaEngajamento;
      document.getElementById('mediaFinal').textContent = mediaFinal;

      const classifica = (nota) => nota >= 7 ? 'Alto' : nota >= 4 ? 'Médio' : 'Baixo';
      const tecnicaClass = classifica(mediaTecnico);
      const engajamentoClass = classifica(mediaEngajamento);
      const classificacao = {
        'Alto-Alto': "1. Potencial máximo",
        'Alto-Médio': "2. Engajado, precisa de reforço técnico",
        'Alto-Baixo': "3. Persistente, sem domínio técnico",
        'Médio-Alto': "4. Promissor, mas instável",
        'Médio-Médio': "5. Desenvolvimento equilibrado",
        'Médio-Baixo': "6. Participa, sem avanços técnicos",
        'Baixo-Alto': "7. Talento técnico, pouco engajamento",
        'Baixo-Médio': "8. Apoio socioemocional",
        'Baixo-Baixo': "9. Alerta pedagógico"
      };
      const chave = `${engajamentoClass}-${tecnicaClass}`;
      document.getElementById('classificacao').textContent = classificacao[chave] || 'Não classificado';
    }

    function atualizarSelect(filtroValor = '') {
      select.innerHTML = '';
      alunos.filter(nome => nome.toLowerCase().includes(filtroValor.toLowerCase())).forEach(nome => {
        const option = document.createElement('option');
        option.value = nome;
        option.textContent = nome;
        select.appendChild(option);
      });
      if (select.options.length > 0) {
        select.selectedIndex = 0;
        preencherNotasAlunoSelecionado();
      }
    }

    filtro.addEventListener('input', e => atualizarSelect(e.target.value));
    select.addEventListener('change', preencherNotasAlunoSelecionado);
    atualizarSelect();
  </script>
</body>
</html>
