<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mini Player</title>
  <style>
    :root{
      --bg:#121212; --panel:#181818; --accent:#1db954; --muted:#9e9e9e; --text:#fff;
      --bezel:#0e0e0e;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(180deg,#0b0b0b,#171717);font-family:system-ui, Arial;color:var(--text);display:grid;place-items:center}

    /* Telefone CSS (sem imagem externa) */
    .phone{
      position:relative;
      width:min(100vw,420px);
      height:100vh; /* ocupa a tela toda do celular */
      max-height:900px; /* evita exagero em monitores grandes */
      background:var(--bg);
      border:10px solid var(--bezel);
      border-radius:36px;
      box-shadow:
        0 20px 60px rgba(0,0,0,.6),
        inset 0 0 0 1px rgba(255,255,255,.05);
      overflow:hidden;
    }
    /* “notch” simples opcional */
    .notch{
      position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:160px; height:24px; background:var(--bezel); border-radius:0 0 16px 16px;
    }

    header{
      padding:16px 20px 8px;
      background:transparent;
      display:flex; align-items:center; gap:12px;
    }
    .app-title{font-weight:700; letter-spacing:.2px}
    .pill{
      margin-left:auto; background:#232323; color:#cfcfcf; padding:6px 10px; border-radius:999px; font-size:12px;
    }

    .hero{
      display:flex; flex-direction:column; align-items:center; padding:16px 20px 8px; text-align:center; gap:10px;
    }
    .cover{
      width:68%; aspect-ratio:1/1; border-radius:14px; overflow:hidden;
      box-shadow:0 12px 28px rgba(0,0,0,.5);
      background:#222 center/cover no-repeat;
    }
    .track-info h2{margin:10px 0 4px; font-size:20px}
    .track-info p{margin:0; color:var(--muted); font-size:13px}

    .playlist{padding:6px 16px 12px; overflow:auto; max-height:40vh}
    .song{
      display:flex; align-items:center; gap:12px;
      background:var(--panel); border:1px solid #232323; border-radius:12px; padding:10px; margin:8px 0;
      cursor:pointer; transition:transform .08s;
    }
    .song:active{transform:scale(.99)}
    .song img{width:48px; height:48px; border-radius:8px; object-fit:cover}
    .song .meta{display:flex; flex-direction:column}
    .song .meta small{color:var(--muted)}
    .song .playtip{margin-left:auto; color:#cfcfcf; font-size:12px; background:#252525; padding:4px 8px; border-radius:999px}

    .controls{
      position:absolute; left:0; right:0; bottom:0;
      padding:12px 16px 20px;
      background:linear-gradient(180deg, rgba(18,18,18,0), #111 40%, #0e0e0e);
      border-top:1px solid #1b1b1b;
    }
    .progress{
      display:flex; align-items:center; gap:8px; font-size:12px; color:#cfcfcf;
    }
    input[type="range"]{ flex:1; accent-color:var(--accent)}
    .buttons{
      margin-top:10px; display:flex; align-items:center; justify-content:center; gap:16px;
    }
    .btn{
      width:48px; height:48px; border-radius:50%; border:0; cursor:pointer; 
      background:#202020; color:#fff; font-size:18px;
      display:grid; place-items:center;
    }
    .btn.primary{ background:var(--accent); color:#000; width:58px; height:58px; font-weight:700 }
    .now{ text-align:center; color:var(--muted); font-size:12px; margin-top:4px}
    /* Scroll suave na playlist */
    .playlist::-webkit-scrollbar{height:6px; width:6px}
    .playlist::-webkit-scrollbar-thumb{background:#2b2b2b; border-radius:10px}
    @media (max-height:700px){
      .playlist{max-height:36vh}
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch" aria-hidden="true"></div>

    <header>
      <div class="app-title">Mini Player</div>
      <span class="pill">Online</span>
    </header>

    <section class="hero">
      <div id="cover" class="cover" style="background-image:url('https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=600&auto=format&fit=crop');"></div>
      <div class="track-info">
        <h2 id="title">SoundHelix Song 1</h2>
        <p id="artist">SoundHelix</p>
      </div>
    </section>

    <section class="playlist" id="playlist">
      <!-- Itens gerados no JS também; deixo 2 estáticos para referência -->
      <div class="song" data-index="0">
        <img src="https://images.unsplash.com/photo-1520975657288-7b12ad33f043?q=80&w=200&auto=format&fit=crop" alt="Capa">
        <div class="meta">
          <strong>Song 1</strong>
          <small>SoundHelix</small>
        </div>
        <span class="playtip">tocar</span>
      </div>
      <div class="song" data-index="1">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=200&auto=format&fit=crop" alt="Capa">
        <div class="meta">
          <strong>Song 2</strong>
          <small>SoundHelix</small>
        </div>
        <span class="playtip">tocar</span>
      </div>
    </section>

    <section class="controls">
      <div class="progress">
        <span id="current">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" />
        <span id="duration">0:00</span>
      </div>
      <div class="buttons">
        <button class="btn" id="prev" aria-label="Anterior">⏮</button>
        <button class="btn primary" id="play" aria-label="Play/Pause">▶</button>
        <button class="btn" id="next" aria-label="Próxima">⏭</button>
      </div>
      <div class="now" id="now">Pronto para tocar</div>
      <audio id="audio" preload="metadata"></audio>
    </section>
  </div>

  <script>
    // ====== PLAYLIST (troque URLs por MP3 locais se estiver sem internet) ======
    const tracks = [
      {
        title: "SoundHelix Song 1",
        artist: "SoundHelix",
        cover: "https://images.unsplash.com/photo-1520975657288-7b12ad33f043?q=80&w=600&auto=format&fit=crop",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        title: "SoundHelix Song 2",
        artist: "SoundHelix",
        cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=600&auto=format&fit=crop",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      },
      {
        title: "SoundHelix Song 3",
        artist: "SoundHelix",
        cover: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?q=80&w=600&auto=format&fit=crop",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
      }
    ];

    // ====== ELEMENTOS ======
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const seek = document.getElementById('seek');
    const currentEl = document.getElementById('current');
    const durationEl = document.getElementById('duration');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const coverEl = document.getElementById('cover');
    const nowEl = document.getElementById('now');
    const playlistEl = document.getElementById('playlist');

    let index = 0;
    let isPlaying = false;
    loadTrack(index);

    // Gera itens extras na playlist conforme tracks[]
    tracks.forEach((t, i) => {
      if(i < 2) return; // já temos 0 e 1 de exemplo
      const item = document.createElement('div');
      item.className = 'song';
      item.dataset.index = i;
      item.innerHTML = `
        <img src="${t.cover}" alt="Capa">
        <div class="meta">
          <strong>${t.title}</strong>
          <small>${t.artist}</small>
        </div>
        <span class="playtip">tocar</span>
      `;
      playlistEl.appendChild(item);
    });

    // Clique na playlist
    playlistEl.addEventListener('click', (e) => {
      const song = e.target.closest('.song');
      if(!song) return;
      index = Number(song.dataset.index);
      loadTrack(index);
      play();
    });

    playBtn.addEventListener('click', () => isPlaying ? pause() : play());
    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', updateDuration);
    audio.addEventListener('ended', next);

    seek.addEventListener('input', (e) => {
      if (audio.duration) audio.currentTime = (seek.value/100) * audio.duration;
    });

    // ====== FUNÇÕES ======
    function loadTrack(i){
      const t = tracks[i];
      audio.src = t.src;
      titleEl.textContent = t.title;
      artistEl.textContent = t.artist;
      coverEl.style.backgroundImage = `url('${t.cover}')`;
      nowEl.textContent = `Selecionado: ${t.title} — ${t.artist}`;
      isPlaying = false;
      playBtn.textContent = '▶';
      seek.value = 0; currentEl.textContent = '0:00'; durationEl.textContent = '0:00';
    }
    function play(){
      audio.play().then(()=>{
        isPlaying = true;
        playBtn.textContent = '⏸';
        nowEl.textContent = `Tocando: ${tracks[index].title}`;
      }).catch(err=>{
        nowEl.textContent = 'Erro ao tocar (verifique internet/MP3).';
        console.error(err);
      });
    }
    function pause(){
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
      nowEl.textContent = `Pausado: ${tracks[index].title}`;
    }
    function prev(){
      index = (index - 1 + tracks.length) % tracks.length;
      loadTrack(index); play();
    }
    function next(){
      index = (index + 1) % tracks.length;
      loadTrack(index); play();
    }
    function updateProgress(){
      if(!audio.duration) return;
      seek.value = (audio.currentTime / audio.duration) * 100;
      currentEl.textContent = formatTime(audio.currentTime);
    }
    function updateDuration(){
      durationEl.textContent = formatTime(audio.duration);
    }
    function formatTime(sec){
      const m = Math.floor(sec/60) || 0;
      const s = Math.floor(sec%60) || 0;
      return `${m}:${s.toString().padStart(2,'0')}`;
    }
  </script>
</body>
</html>
