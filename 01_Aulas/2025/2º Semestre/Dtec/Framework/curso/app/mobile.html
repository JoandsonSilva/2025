<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Awari Music — Mini Player</title>
  <style>
    /* ======= Base simples e limpa ======= */
    :root{
      --bg:#0f1115;
      --surface:#141820;
      --surface-2:#19202b;
      --text:#e8eaed;
      --muted:#9aa4b2;
      --brand:#3ddc84; /* verdinho Android/Spotify vibe */
      --bezel:#0a0c10;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 50% -200px, #213048 0%, transparent 60%),
        linear-gradient(180deg,#0b0e13 0%, #0f1115 60%, #0b0e13 100%);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:grid; place-items:center;
      padding:12px;
    }

    /* ======= “Aparência de celular” minimalista ======= */
    .phone{
      width:min(100vw, 390px);
      height:calc(100vh - 24px);
      max-height:820px;
      background:var(--surface);
      border:8px solid var(--bezel);
      border-radius:32px;
      box-shadow:
        0 30px 60px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255,255,255,.05);
      overflow:hidden;
      display:flex; flex-direction:column;
    }
    .notch{
      width:160px; height:18px; border-radius:0 0 12px 12px;
      background:var(--bezel); margin:0 auto;
    }

    /* ======= Header enxuto ======= */
    header{
      padding:14px 18px 8px;
      display:flex; align-items:center; gap:10px;
    }
    .logo-dot{
      width:10px; height:10px; border-radius:50%; background:var(--brand);
      box-shadow:0 0 8px rgba(61,220,132,.8);
    }
    .brand{font-size:15px; font-weight:700; letter-spacing:.2px}
    .status{margin-left:auto; font-size:12px; color:var(--muted); background:#0d121a; padding:4px 8px; border-radius:999px;}

    /* ======= Conteúdo ======= */
    main{display:flex; flex-direction:column; gap:16px; padding:12px 18px 18px;}

    .cover{
      align-self:center;
      width:75%;
      aspect-ratio:1/1;
      border-radius:16px;
      overflow:hidden;
      background:var(--surface-2);
      box-shadow: 0 12px 26px rgba(0,0,0,.45);
    }
    .cover img{width:100%; height:100%; object-fit:cover; display:block}

    .info{ text-align:center; }
    .title{ margin:10px 0 4px; font-size:20px; font-weight:700; }
    .artist{ margin:0; font-size:13px; color:var(--muted); }

    /* ======= Cartão do player (usa controles nativos do <audio>) ======= */
    .card{
      background:linear-gradient(180deg, #151b23, #121821);
      border:1px solid #232b36;
      border-radius:16px;
      padding:12px;
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }
    audio{width:100%}

    /* ======= Rodapé discreto ======= */
    .footer{
      margin-top:auto;
      padding:10px 18px 18px;
      font-size:11px; color:var(--muted);
      text-align:center;
      opacity:.9;
    }

    /* ======= Acessórios ======= */
    .btn{
      display:inline-block;
      background:var(--brand);
      color:#0a0c10;
      text-decoration:none;
      font-weight:700;
      padding:10px 14px;
      border-radius:999px;
      text-align:center;
    }

    /* ======= Ajuste para telas muito baixas (notebooks) ======= */
    @media (max-height:680px){
      .cover{width:68%}
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch" aria-hidden="true"></div>

    <header>
      <span class="logo-dot" aria-hidden="true"></span>
      <span class="brand">Awari Music</span>
      <span class="status">online</span>
    </header>

    <main>
      <figure class="cover">
        <!-- troque a imagem abaixo pela capa que quiser -->
        <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=800&auto=format&fit=crop" alt="Capa do álbum">
      </figure>

      <section class="info" aria-label="Informações da faixa">
        <h2 class="title">SoundHelix Song 1</h2>
        <p class="artist">SoundHelix</p>
      </section>

      <section class="card" aria-label="Controles do player">
        <!-- Dica: se estiver sem internet, baixe 1 MP3 e use ./musicas/01.mp3 -->
        <audio controls preload="metadata">
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
          Seu navegador não suporta áudio.
        </audio>
      </section>

      <!-- botão opcional: poderia abrir outra “tela” em uma versão futura -->
      <!-- <a class="btn" href="#" aria-disabled="true">Explorar</a> -->
    </main>

    <div class="footer">
      Dica: abra o DevTools → Toggle Device Toolbar (Ctrl+Shift+M) e escolha iPhone 12/14.
    </div>
  </div>
</body>
</html>
