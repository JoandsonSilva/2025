<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Despertar – Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-url: url('https://images.unsplash.com/photo-1482192505345-5655af888cc4?q=80&w=1920&auto=format&fit=crop');
            /* troque pela sua imagem */
            --brand: #0f2a3d;
            /* azul escuro do botão */
            --brand-600: #133a55;
            --text: #0b1220;
            --muted: #6b7280;
            --white: #ffffff;
            --shadow: 0 10px 25px rgba(0, 0, 0, .25);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif;
            color: var(--text);
            /* Fundo com imagem + véu sutil */
            background:
                radial-gradient(1000px 600px at 75% 40%, rgba(255, 255, 255, .35), rgba(255, 255, 255, 0) 55%),
                linear-gradient(180deg, rgba(255, 255, 255, .65), rgba(255, 255, 255, .35)),
                var(--bg-url) center/cover no-repeat fixed;
            display: grid;
            place-items: center;
            padding: 32px;
        }

        .login-card {
            display: grid;
            gap: 18px;
            width: min(420px, 92vw);
            padding: 28px;
            backdrop-filter: saturate(120%);
            /* transparência quase nula para manter parecido com a referência */
            background: transparent;
        }

        .brand {
            margin-inline: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .brand__word {
            font-weight: 700;
            color: #1f2937;
            letter-spacing: .2px;
        }

        .brand__chev {
            fill: var(--brand);
        }

        form {
            display: grid;
            gap: 12px;
        }

        .field {
            position: relative;
        }

        .field input {
            width: 100%;
            padding: 12px 44px 12px 44px;
            /* espaço para os ícones */
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            outline: none;
            background: var(--white);
            color: #111827;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .02);
            transition: border-color .2s, box-shadow .2s;
        }

        .field input::placeholder {
            color: #9ca3af;
        }

        .field input:focus {
            border-color: #c7d2fe;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .15);
        }

        .icon-left,
        .icon-right {
            position: absolute;
            inset-block: 0;
            display: grid;
            place-items: center;
            color: #9aa4b2;
            width: 40px;
            pointer-events: none;
            /* apenas decorativo (sem JS) */
        }

        .icon-left {
            left: 0;
        }

        .icon-right {
            right: 0;
        }

        .btn {
            appearance: none;
            border: none;
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: .3px;
            background: var(--brand);
            color: var(--white);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform .04s ease, background .2s ease;
        }

        .btn:hover {
            background: var(--brand-600);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Acessibilidade: rótulos visíveis apenas para leitores de tela */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Footer opcional */
        .footer {
            text-align: center;
            font-size: .8rem;
            color: var(--muted);
        }

        @media (max-height: 540px) {
            body {
                align-items: start;
            }
        }
    </style>
</head>

<body>
    <main class="login-card" aria-label="Tela de login">
        <!-- Marca Nextflow + setinha -->
        <div class="brand" aria-hidden="true">
            <span class="brand__word">Despertar Tec</span>
            <svg class="brand__chev" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>

        <form action="#" method="post" autocomplete="on">
            <div class="field">
                <label class="sr-only" for="user">Usuário</label>
                <input id="user" name="user" type="text" placeholder="Usuário" required />
                <span class="icon-left" aria-hidden="true">
                    <!-- user icon -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21a8 8 0 10-16 0" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </span>
            </div>

            <div class="field">
                <label class="sr-only" for="pass">Senha</label>
                <input id="pass" name="pass" type="password" placeholder="Senha" required />
                <span class="icon-right" aria-hidden="true">
                    <!-- eye-off icon (decorativo; sem toggle JS) -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.94 10.94 0 0112 20c-5 0-9.27-3.11-11-8 1-2.73 2.67-4.94 4.94-6.06" />
                        <path d="M1 1l22 22" />
                        <path d="M10.58 10.58a2 2 0 102.83 2.83" />
                        <path d="M9.88 5.09A10.94 10.94 0 0112 4c5 0 9.27 3.11 11 8a11.65 11.65 0 01-2.28 3.95" />
                    </svg>
                </span>
            </div>

            <button class="btn" type="submit">ENTRAR</button>
        </form>

        <p class="footer">© <span id="year"></span> Nextflow</p>
    </main>

    <script>
        // Atualiza o ano no rodapé (opcional)
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
