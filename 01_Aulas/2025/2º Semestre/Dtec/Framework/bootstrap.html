<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="p-5">

    <h1 class="text-primary">Olá, Bootstrap!</h1>
    <button class="btn btn-success">Clique aqui</button>

<!-- Base: criar index.html com link CDN do Bootstrap 5.

Navbar: navbar-expand-md navbar-dark bg-dark + menu “Catálogo/Carrinho”.

Hero simples: bg-light py-4 com título + badge de promoção.

Grid responsiva: row g-3 + col-12 col-sm-6 col-lg-4.

Card padrão: imagem + título + preço riscado + preço atual + botão.

Diferenciais: usar badge, shadow-sm, text-decoration-line-through.

Testes de responsividade: redimensionar janela / inspecionar breakpoints.


Plano Curto (50–60 min)

Aquecimento (5 min): “Sem framework, quanto tempo para uma vitrine responsiva de 6 cards?”

Demo guiada (15 min): montar navbar + 6 cards com grid e badges.

Mão na massa (20 min): estudantes replicam catálogo (3 colunas no desktop, 1 no mobile).

Reflexão (5 min): listar o que o framework resolveu (responsividade, spacing, alinhamento).

Mini-carrinho (10 min): inserir table e alert de cupom.

2) Plano Detalhado (90–110 min)

Contexto (10 min): frameworks como “atalhos confiáveis”. Mostrar antes/depois do CSS puro.

Catálogo em pares (30 min): navbar → hero mini → grid 2/3/4 col (breakpoints) → cards com badge “-20%”.

Carrinho (25 min): tabela com subtotal + resumo/checkout em card lateral.

Form de endereço (15 min): inputs com classes do Bootstrap + validação nativa HTML5.

Refatorar (10 min): extrair padrões (card base), nomear utilitárias, limpar repetição.

Showcase (10 min): 2 grupos apresentam decisões de layout.-->
