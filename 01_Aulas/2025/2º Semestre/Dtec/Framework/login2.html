<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoFinance — Login (sem SVG)</title>
    <style>
        :root {
            --blue-1: #0b63e5;
            /* topo do gradiente */
            --blue-2: #001c67;
            /* base do gradiente */
            --brand: #0b63e5;
            /* botão */
            --bg: #f6f8fb;
            /* cinza de fundo da página */
            --text: #111827;
            --muted: #6b7280;
            --radius: 24px;
            /* raio do cartão */
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            display: grid;
            place-items: center;
         
        }

        /* === Shell / Card === */
        .card {
            width: min( 100vw);
            min-height:100vh;
            background: #fff;
           
            box-shadow: 0 20px 60px rgba(0, 0, 0, .08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* === Painel esquerdo (branding) === */
        .left {
            position: relative;
            background: linear-gradient(160deg, var(--blue-1), var(--blue-2));
            color: #fff;
            display: grid;
            align-content: center;
            gap: 16px;
            padding: 56px 64px;
        }   

        .left h1 {
            margin: 0;
            font-size: 40px;
            letter-spacing: .3px
        }

        .left p {
            margin: 0;
            color: rgba(255, 255, 255, .85)
        }

        .left .cta {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, .12);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, .2);
        }

        /* círculos decorativos sem SVG: apenas bordas e border-radius */
        .ring {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 50%;
        }

        .ring.r1 {
            width: 460px;
            height: 460px;
            left: -120px;
            bottom: -160px
        }

        .ring.r2 {
            width: 300px;
            height: 300px;
            left: 40px;
            bottom: -60px
        }

        /* === Painel direito (form) === */
        .right {
            display: grid;
            align-content: center;
            padding: 56px 64px;
            gap: 22px
        }

        .right h2 {
            margin: 0 0 2px;
            font-size: 22px
        }

        .right .sub {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 14px
        }

        form {
            display: grid;
            gap: 12px
        }

        .field {
            position: relative
        }

        .input {
            width: 100%;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 28px;
            padding: 12px 16px 12px 44px;
            outline: none;
            font: inherit;
            color: #111827;
            transition: border-color .2s, box-shadow .2s;
        }

        .input::placeholder {
            color: #9ca3af
        }

        .input:focus {
            border-color: #bfd6ff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .15)
        }

        /* Ícones sem SVG: usando pseudo-elementos com emoji */
        .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa4b2;
            font-size: 16px
        }


        .btn {
            border: 0;
            border-radius: 28px;
            padding: 12px 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(180deg, #0f74ff, #0a56cf);
            box-shadow: 0 8px 18px rgba(15, 116, 255, .28);
        }

        .btn:hover {
            filter: brightness(.98)
        }

        .link {
            display: inline-block;
            text-decoration: none;
            color: var(--muted);
            font-size: 12px;
            text-align: center
        }

        .link:hover {
            text-decoration: underline
        }

        /* === Responsivo === */
        @media (max-width: 900px) {
            .card {
                grid-template-columns: 1fr
            }

            .left {
                min-height: 220px;
                padding: 40px
            }

            .right {
                padding: 32px
            }
        }
    </style>
</head>

<body>
    <section class="card" aria-label="Tela de login GoFinance">
        <!-- Coluna esquerda: branding -->
        <div class="left">
            <h1>Dtec Finance ›</h1>
            <p>A financeira mais inovadora de São Paulo</p>
            <a class="cta" href="#" aria-label="Read more about GoFinance">Saiba mais</a>
            <span class="ring r1" aria-hidden="true"></span>
            <span class="ring r2" aria-hidden="true"></span>
        </div>

        <!-- Coluna direita: formulário -->
        <div class="right">
            <div>
                <h2>Olá!</h2>
                <p class="sub">Seja bem-vindo</p>
            </div>

            <form action="#" method="post" autocomplete="on">
                <label class="field">
                    <span class="sr-only">Email </span>
                    <span aria-hidden="true"></span>
                    <input class="input" type="email" name="email" placeholder="Email Address" required>
                </label>

                <label class="field">
                    <span class="sr-only">Password</span>
                    <span aria-hidden="true"></span>
                    <input class="input" type="password" name="password" placeholder="Password" required>
                </label>

                <button class="btn" type="submit">Login</button>
            </form>

            <a class="link" href="#">Esqueci a Senha</a>
        </div>
    </section>

    <style>
        /* utilidade: somente aqui para manter o arquivo curto */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0
        }
    </style>
</body>

</html>
