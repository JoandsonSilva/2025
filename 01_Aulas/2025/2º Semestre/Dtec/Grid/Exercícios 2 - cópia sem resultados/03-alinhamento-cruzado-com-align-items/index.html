<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 03 — Alinhamento cruzado com `align-items`</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .item:nth-child(2) {
      height: 60px;
    }

    .item:nth-child(3) {
      height: 100px;
    }
  </style>
</head>

<body>


  <div class="container">
    <div class="item">Baixo</div>
    <div class="item">Médio (60px)</div>
    <div class="item">Alto (100px)</div>
  </div>
  
</body>

</html>
