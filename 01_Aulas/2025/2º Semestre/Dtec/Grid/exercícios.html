<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de CSS Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h2 {
            background: #f4f4f4;
            padding: 10px;
        }

        section {
            padding: 20px;
            border-bottom: 2px solid #ddd;
        }

        /* 1 Grid Básico */
        .grid-basico {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            border: black 1px solid;
        }

        .grid-basico img {
            width: 100%;
            border-radius: 5px;
            
        }


        /* 2️ Layout de Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 15px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            transition: 0.3s;
        }

        .card:hover {
            background: #f8f8f8;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
        }

        .card img {
            max-width: 100%;
            border-radius: 5px;
        }



        /*     3️ Cabeçalho Responsivo 
        .cabecalho {
            display: grid;
            grid-template-areas: 
                "logo menu botao";
            grid-template-columns: 1fr 2fr 1fr;
            background: #333;
            color: white;
            padding: 10px;
            align-items: center;
        }

        .logo { grid-area: logo; }
        .menu { grid-area: menu; text-align: center; }
        .botao { grid-area: botao; text-align: right; }
 */


        /* 4️ Galeria Criativa */
        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6,150px);
            gap: 10px;
        }

        .galeria img {
            width: 100%;
            height: 100%;
            object-fit:cover;
            border-radius: 5px;
        }

        .item1 {
            grid-column: 1 /3
        }

        .item2 {
            grid-column: 3/4;
        }

        .item3 {
            grid-column: 2/3;
            grid-row: 4/6;
        }
        .item4{
            grid-column: 1/2;
            grid-row: 2/3;

        }
        .item5{
            grid-column: 2/4;
            grid-row: 2/4;
        }
        .item6{
            grid-column:1/2 ;
            grid-row: 3/5;
        }
        .item7{
            grid-column: 3/4;
            grid-row: 4/6;
        }
        .item8{
            grid-column: 1/2;
            grid-row: 5/6;
        }
        .item9{
            grid-column: 1/4;
            grid-template-rows: 7/7;
        }



img.grid-basico{
