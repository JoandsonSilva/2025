Em HTML, a tag <tr> define uma linha em uma tabela. Ela é usada dentro da tag <table> para agrupar células (definidas por <td> ou <th>) em uma mesma linha. Resumindo, <tr> significa "table row" (linha da tabela) e é essencial para a estrutura de tabelas HTML. 
Estrutura básica:
A tag <tr> é usada dentro de uma tag <table> para criar linhas. Dentro de cada <tr>, você pode adicionar células usando as tags <td> (para dados comuns) ou <th> (para cabeçalhos de tabela). 
  <td> define uma célula de dados dentro de uma tabela
